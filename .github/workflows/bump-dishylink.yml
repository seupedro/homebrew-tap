name: Bump Dishylink

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Point the cask at the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/bump-dishylink.sh

      - name: Commit and push
        run: |
          git diff --quiet && exit 0
          version=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/dishylink.rb)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "dishylink $version"
          git push
